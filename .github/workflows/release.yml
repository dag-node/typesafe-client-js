# Builds the ESM output from a v* tag and attaches it to the release as one tarball with
# its sha256, so a consumer can vendor it at a pinned tag and verify what it took.
#
# dist/ is not committed (see .gitignore), so the release is built here rather than
# uploaded from the checkout: the asset is the output of this workflow, from this tag.
# `tsc` is the whole build, so the same command off the same tag reproduces the asset
# anywhere -- which is what makes the checksum a claim a reader can check.
#
# Actions are pinned to a full-length commit SHA, which the organisation requires and
# which is what makes a third-party action's code fixed -- a tag can be moved onto
# another commit by whoever owns the action.
name: Release

on:
  push:
    tags: ['v*']

# Read-only by default; the one job that attaches an asset asks for contents: write.
permissions: read-all

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
          cache: npm

      # The tag is the release authority, so it is checked before anything else runs. The key
      # that signs it is not one this workflow can use: the only signing secret here is
      # GPG_SIGNING_KEY, which signs the artifact, so a runner does not hold a key that
      # produces a tag signature passing this step.
      #
      # The fingerprint is the pin; the URL is only transport. A key added to a compromised
      # account does not match it, and because the pin names the PRIMARY rather than the
      # subkey that signs, rotating the subkey leaves this step alone.
      - name: Verify the tag signature
        env:
          TAG_SIGNING_PRIMARY_FPR: 225DFF22D0221D3DD68CCEFFFABAF500E7D90733
          TAG_SIGNING_KEY_URL: https://github.com/p4nda.gpg
        run: |
          set -euo pipefail
          # checkout leaves a detached HEAD; fetch the tag object itself, which is what
          # carries the signature. A lightweight tag has none and fails here, as it should.
          git fetch --no-tags --depth=1 origin \
              "+refs/tags/${GITHUB_REF_NAME}:refs/tags/${GITHUB_REF_NAME}"
          gnupghome="$(mktemp -d)"
          trap 'rm -rf "${gnupghome}"' EXIT
          export GNUPGHOME="${gnupghome}"
          curl -fsS "${TAG_SIGNING_KEY_URL}" | gpg --batch --quiet --import
          # `--raw` prints GnuPG's status lines. VALIDSIG names the subkey that signed and, as
          # its last field, the primary that certified it -- which is the field pinned here.
          status="$(git verify-tag --raw "${GITHUB_REF_NAME}" 2>&1)"
          if ! grep -qE "^\[GNUPG:\] VALIDSIG .* ${TAG_SIGNING_PRIMARY_FPR}$" <<<"${status}"; then
              printf 'tag %s is not signed by %s\n%s\n' \
                  "${GITHUB_REF_NAME}" "${TAG_SIGNING_PRIMARY_FPR}" "${status}" >&2
              exit 1
          fi

      # Prove the signing key before building or publishing: a missing or unusable secret
      # fails here rather than after the release page is already public, where a late failure
      # strands a half-published release. Every release is signed, so an unusable key stops
      # this job instead of publishing an unsigned artifact.
      - name: Preflight the signing key
        env:
          GPG_SIGNING_KEY: ${{ secrets.GPG_SIGNING_KEY }}
          GPG_SIGNING_PASSPHRASE: ${{ secrets.GPG_SIGNING_PASSPHRASE }}
        run: |
          set -euo pipefail
          [[ -n "${GPG_SIGNING_KEY}" ]] \
            || { echo "::error::GPG_SIGNING_KEY is not set -- every release is signed"; exit 1; }
          [[ -n "${GPG_SIGNING_PASSPHRASE}" ]] \
            || { echo "::error::GPG_SIGNING_PASSPHRASE is not set -- the signing key is passphrase-protected"; exit 1; }
          # The signing step reads the passphrase as one line on a descriptor; a multi-line
          # value would truncate there, after the release is public.
          [[ "${GPG_SIGNING_PASSPHRASE}" != *$'\n'* ]] \
            || { echo "::error::GPG_SIGNING_PASSPHRASE must be single-line"; exit 1; }
          # A keyring directory on tmpfs, wiped on exit: the key stays out of persistent disk,
          # and it arrives on stdin rather than in a file or an argument, where a process
          # listing would show it.
          gnupghome="$(mktemp -d -p /dev/shm 2>/dev/null || mktemp -d)"
          trap 'rm -rf "${gnupghome}"' EXIT
          printf '%s\n' "${GPG_SIGNING_KEY}" | GNUPGHOME="${gnupghome}" gpg --batch --quiet --import \
            || { echo "::error::GPG_SIGNING_KEY is not a usable ASCII-armored key"; exit 1; }
          GNUPGHOME="${gnupghome}" gpg --batch --with-colons --list-secret-keys | grep -q '^sec:' \
            || { echo "::error::GPG_SIGNING_KEY carries no secret key -- export the signing subkey"; exit 1; }

      - name: Install, check, and build
        run: |
          set -euo pipefail
          npm ci --ignore-scripts
          npm run typecheck
          npm run build
          # After the build: the suite exercises dist/, and skips itself when that is absent.
          npm test

      - name: Check the tag against the package version
        run: |
          set -euo pipefail
          # Exact match, prerelease suffix included: a v0.2.0-rc1 tag wants 0.2.0-rc1 in the
          # manifest. Comparing the x.y.z core alone would let an rc build call itself the
          # release, and the manifest is the one place the version is written down.
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(node -p 'require("./package.json").version')"
          if [[ "${tag}" != "${pkg}" ]]; then
              printf 'tag %s does not match package.json version %s -- set the manifest to %s, suffix and all\n' \
                  "${GITHUB_REF_NAME}" "${pkg}" "${tag}" >&2
              exit 1
          fi

      - name: Create the release and attach the signed artifact
        env:
          GH_TOKEN: ${{ github.token }}
          GPG_SIGNING_KEY: ${{ secrets.GPG_SIGNING_KEY }}
          GPG_SIGNING_PASSPHRASE: ${{ secrets.GPG_SIGNING_PASSPHRASE }}
        run: |
          set -euo pipefail
          # `dist` in the name, and the tag's own `v`, keep this apart from the source
          # archives GitHub attaches to every release: it names those for the tag with its
          # leading `v` stripped, so typesafe-client-js-0.1.0.tar.gz sits beside this one
          # carrying src/ rather than the build. A consumer pins an asset by name, and
          # without the qualifier the two are one character apart.
          asset="typesafe-client-js-dist-${GITHUB_REF_NAME}.tar.gz"
          # Reproducible: sorted entries, no owner, no gzip timestamp, and every mtime set
          # to the tagged commit's own date, so the same tag builds to the same bytes and
          # the checksum this step writes is a claim a reader can re-check. A fixed date would do the
          # first of those and state something untrue; SOURCE_DATE_EPOCH is the convention
          # for the second (reproducible-builds.org). The root LICENSE and CHANGELOG.md go in
          # beside the modules, so MIT's notice and the release's record travel with the build.
          SOURCE_DATE_EPOCH="$(git log -1 --format=%ct HEAD)"
          tar --sort=name --owner=0 --group=0 --numeric-owner \
              --mtime="@${SOURCE_DATE_EPOCH}" \
              --pax-option=exthdr.name=%d/PaxHeaders/%f,delete=atime,delete=ctime \
              -C dist -cf - . -C "${PWD}" ./LICENSE ./CHANGELOG.md | gzip -n > "${asset}"
          sha256sum "${asset}" > "${asset}.sha256"
          # Verify before publishing, so a signature that did not come out usable fails
          # here rather than on the machine of whoever downloads it.
          gnupghome="$(mktemp -d -p /dev/shm 2>/dev/null || mktemp -d)"
          trap 'rm -rf "${gnupghome}"' EXIT
          export GNUPGHOME="${gnupghome}"
          printf '%s\n' "${GPG_SIGNING_KEY}" | gpg --batch --quiet --import
          printf '%s' "${GPG_SIGNING_PASSPHRASE}" | gpg --batch --yes --pinentry-mode loopback \
              --passphrase-fd 0 --armor --detach-sign --output "${asset}.asc" "${asset}"
          gpg --batch --verify "${asset}.asc" "${asset}"
          # Semver reads anything after the first `-` as a prerelease, so v0.2.0-rc1 is
          # published as one and does not become the release a consumer is offered as latest.
          prerelease=()
          case "${GITHUB_REF_NAME}" in
              *-*) prerelease=(--prerelease) ;;
          esac
          gh release create "${GITHUB_REF_NAME}" "${asset}" "${asset}.sha256" "${asset}.asc" \
              --verify-tag --generate-notes "${prerelease[@]}"
